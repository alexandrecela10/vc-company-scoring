# =====================================================================
# rules.yaml  --  per-metric extraction configuration
# =====================================================================
# This is the SINGLE SOURCE OF TRUTH for how each metric is extracted
# from a text chunk. Adding/tuning a metric = editing this file.
# No Python changes needed for 95% of metric work.
#
# How the engine uses it:
#   1. For each chunk, for each metric in this file, try each `method`
#      in order.
#   2. The FIRST method that produces a valid observation wins for that
#      (chunk, metric) pair.
#   3. Observations across chunks are later reconciled by value_resolver.
#
# The top-level key MUST equal `metric.code` in the database. If the key
# doesn't exist in the DB, the engine logs a warning and skips.
#
# ---------------------------------------------------------------------
# Method types:
#   regex     -- Python regex with named capture groups. Engine extracts
#                capture groups, then normalises (see `normalise` block).
#   enum_map  -- Keyword -> value map. First keyword found in the chunk
#                (case-insensitive) wins.
#   llm       -- Retrieval-augmented LLM call. Engine retrieves top-K
#                chunks by keyword overlap, sends them to Gemini with a
#                strict prompt, and REQUIRES a verbatim quote that is a
#                substring of the chunk. No quote -> observation rejected.
#
# Confidence calibration (baseline, not gospel):
#   regex match with clean capture: 0.85 - 0.95
#   enum_map exact keyword:         0.90 - 0.95
#   llm with quote verified:        0.65 - 0.80
#   llm without quote:              REJECTED (no row written)
# ---------------------------------------------------------------------

# =====================================================================
# mrr  --  Monthly Recurring Revenue (USD)
# =====================================================================
# A decimal number of USD. "$12k MRR" -> 12000, "MRR: $1.2M" -> 1200000.
# We intentionally do NOT match ARR here (ARR != MRR; deriving MRR=ARR/12
# is a separate derivation we'll add in Phase 2b).
mrr:
  value_type: number
  unit: usd
  # Sanity range so a typo like "$1,200,000,000,000" doesn't persist.
  validate:
    min: 0
    max: 10_000_000_000  # $10B MRR = larger than most public co's; safe ceiling
  # Temporal contract (Phase 2c).
  # MRR is an inherently monthly rate. as_of_date required so we know which
  # month's MRR. Scenario defaults to `actual`; projections are rare in decks.
  temporal:
    requires: [as_of_date]
    period_granularity: month
    default_scenario_filter: actual
  methods:
    # ----- Method 1: regex (high confidence) ------------------------
    # Two patterns cover the common phrasings. Both use named groups
    # `amount` and `unit` which the engine's number normaliser consumes.
    #
    # Pattern A -- "$12k MRR", "$1.2M monthly recurring revenue"
    # Pattern B -- "MRR of $12k", "MRR: 1.2M", "monthly recurring revenue 1.2M"
    - method: regex
      confidence: 0.90
      patterns:
        - '\$\s*(?P<amount>[\d.,]+)\s*(?P<unit>k|m|mm|b|million|billion)?\s*(?:mrr|monthly\s+recurring\s+revenue)'
        - '(?:mrr|monthly\s+recurring\s+revenue)[:\s]+\$?\s*(?P<amount>[\d.,]+)\s*(?P<unit>k|m|mm|b|million|billion)?'
      # After regex, normalise the amount: parse number, apply unit multiplier.
      normalise:
        kind: number_with_unit
        unit_group: unit      # which named group holds the unit
        amount_group: amount  # which named group holds the number
        units:
          k: 1_000
          m: 1_000_000
          mm: 1_000_000
          million: 1_000_000
          b: 1_000_000_000
          billion: 1_000_000_000
          # null/missing unit -> multiplier 1 (handled by engine default)

    # ----- Method 2: LLM fallback (lower confidence) ----------------
    # Only runs if regex returned nothing for this metric.
    # The engine retrieves the top-N chunks by keyword overlap with
    # `retrieval_query` and sends them to Gemini with a strict prompt.
    - method: llm
      confidence: 0.70
      retrieval_query: "monthly recurring revenue MRR run rate subscription revenue"
      max_chunks: 3
      # Engine-side guardrails (enforced in llm_fallback.py, documented here):
      #   - Output must contain a verbatim quote that is substring of a chunk
      #   - Output must be a numeric USD value or "unknown"
      #   - "unknown" -> no observation, no gap (LLM said it couldn't tell)

# =====================================================================
# employee_count  --  Team size (headcount)
# =====================================================================
# A whole number. "team of 35" -> 35, "45 employees" -> 45.
# NOT the same as "users" or "customers" -- the engine only matches
# people-specific keywords to avoid collisions.
employee_count:
  value_type: number
  unit: people
  validate:
    min: 0
    max: 500_000   # Amazon has ~1.5M, but a scorable VC target won't.
  # Temporal contract: headcount is a point-in-time snapshot.
  # Projections ("target: 95 FTEs by 2027") are common on growth slides --
  # the resolver must filter those out unless explicitly asked.
  temporal:
    requires: [as_of_date]
    period_granularity: point_in_time
    default_scenario_filter: actual
  methods:
    - method: regex
      confidence: 0.88
      patterns:
        # "35 employees", "35 full-time employees"
        - '(?P<amount>\d{1,6})\s+(?:full[-\s]?time\s+)?employees\b'
        # "team of 35", "team size: 35", "headcount: 35"
        - '(?:team\s+(?:of|size)|headcount)[:\s]+(?P<amount>\d{1,6})\b'
        # "35-person team", "35 person company"
        - '(?P<amount>\d{1,6})[-\s]person\s+(?:team|company|startup)'
      normalise:
        kind: integer
        amount_group: amount

    - method: llm
      confidence: 0.65
      retrieval_query: "team employees headcount FTE staff size"
      max_chunks: 3

# =====================================================================
# funding_stage  --  Latest funding round, mapped to a 1-5 score
# =====================================================================
# value_type is score_1_5, so the stored value is an integer 1-5.
# This is a DERIVABLE score_1_5 (enum map), not a judgmental one.
funding_stage:
  value_type: score_1_5
  # Temporal contract: funding stage is a point-in-time label that only
  # changes at the next round. Latest-known wins; no scenario concept.
  temporal:
    requires: []
    period_granularity: point_in_time
  methods:
    # ----- Method 1: enum_map (highest confidence) ------------------
    # Keys are lowercased before matching against the lowercased chunk.
    # The FIRST key found (scanning left-to-right through the chunk)
    # wins. Later mentions of a different stage are ignored.
    #
    # Note: "series a" etc. are multi-word -- the engine uses word-
    # boundary matching so "series axolotl" won't trigger "series a".
    - method: enum_map
      confidence: 0.92
      # Ordered from most-specific-first to avoid false positives:
      # "pre-seed" must be checked before "seed" so that a "pre-seed"
      # chunk doesn't match "seed" instead.
      map:
        "pre-seed":        1
        "pre seed":        1
        "preseed":         1
        "seed stage":      2
        "seed round":      2
        "seed":            2
        "series a":        3
        "series-a":        3
        "series b":        4
        "series-b":        4
        "series c":        5
        "series-c":        5
        "series d":        5
        "series-d":        5
        "series e":        5
        "growth stage":    5

    - method: llm
      confidence: 0.65
      retrieval_query: "funding stage round raised investors seed series"
      max_chunks: 3

# =====================================================================
# founding_year  --  Year the company was incorporated
# =====================================================================
# A 4-digit year. "Founded in 2019" -> 2019.
founding_year:
  value_type: number
  unit: year
  validate:
    min: 1900   # pre-modern startups exist but are out of scope
    max: 2030   # generous upper bound; guards against typos like 20199
  # Temporal contract: founding year is an IMMUTABLE historical fact.
  # No as_of_date needed -- the value IS the date.
  temporal:
    requires: []
    period_granularity: point_in_time
  methods:
    - method: regex
      confidence: 0.92
      patterns:
        # "founded in 2019", "founded 2019"
        - '\bfounded\s+(?:in\s+)?(?P<amount>(?:19|20)\d{2})\b'
        # "established 2019", "est. 2019"
        - '\b(?:established|est\.?)\s+(?P<amount>(?:19|20)\d{2})\b'
        # "incorporated in 2019"
        - '\bincorporated\s+(?:in\s+)?(?P<amount>(?:19|20)\d{2})\b'
        # Structured: "Founded: 2019", "Year founded: 2019"
        - '(?:year\s+founded|founding\s+year|founded)[:\s]+(?P<amount>(?:19|20)\d{2})\b'
      normalise:
        kind: integer
        amount_group: amount

    - method: llm
      confidence: 0.70
      retrieval_query: "founded established incorporated year inception"
      max_chunks: 3

# =====================================================================
# prior_successful_exit  --  Does any founder have a prior exit?
# =====================================================================
# Boolean (stored as "true"/"false"). Positive signal wins: if ANY
# chunk contains a positive exit keyword, we emit true. Absence of
# evidence is NOT evidence of absence -- we don't emit `false`
# deterministically from a deck (that would be over-claiming).
# If no positive signal is found, no observation is written and the
# orchestrator may create a gap_action ("ask founders").
prior_successful_exit:
  value_type: boolean
  # Temporal contract: a founder's past-exit history is a point-in-time
  # fact about a person. Once true, stays true.
  temporal:
    requires: []
    period_granularity: point_in_time
  methods:
    # ----- Method 1: keyword scan (enum_map with only "true" values) -
    # We abuse enum_map here: every keyword maps to "true". The engine
    # treats the result as a boolean observation.
    - method: enum_map
      confidence: 0.80
      # Each keyword requires the chunk to ALSO contain a founder-
      # adjacency signal ("founder", "co-founder", "ceo", "previously").
      # This is enforced by the engine when `require_context` is set.
      require_context:
        any_of:
          - "founder"
          - "co-founder"
          - "cofounder"
          - "ceo"
          - "previously"
          - "prior to"
          - "before founding"
      map:
        "acquired by":           true
        "sold to":               true
        "successful exit":       true
        "previously sold":       true
        "ipo'd":                 true
        "took public":           true
        "led to acquisition":    true
        "exited to":             true
        "acqui-hired by":        true
        "acquihired by":         true

    # ----- Method 2: LLM fallback ------------------------------------
    # Looks at founder-bio-like chunks. Must return true/false/unknown
    # with a verbatim quote. "unknown" -> no observation (not a false).
    - method: llm
      confidence: 0.70
      retrieval_query: "founder previously exit sold acquired IPO prior company"
      max_chunks: 4

# =====================================================================
# arr  --  Annual Recurring Revenue (USD)
# =====================================================================
# A USD dollar figure. Grammar is almost identical to `mrr` but with the
# "annual" keyword. Decks commonly report ARR on financial slides in
# either inline form ("$2.4M ARR") or table form (ARR row with yearly
# columns). Regex handles the inline case; LLM fallback handles tables
# where it can quote the right cell and reject projection columns.
arr:
  value_type: number
  unit: usd
  validate:
    min: 0
    max: 100_000_000_000   # $100B ceiling; defends against "$52.0" being read as $52B
  # Temporal contract: ARR is the textbook ambiguous metric. A deck row
  # like "2024 | 2025 | 2026E | 2027P | 2028P" can yield 5 observations;
  # without scenario + as_of_date the resolver can't pick the right one.
  # Both are REQUIRED -- an observation missing either is rejected.
  temporal:
    requires: [as_of_date, scenario]
    period_granularity: year
    default_scenario_filter: actual   # scorer ignores projections by default
  methods:
    - method: regex
      confidence: 0.90
      patterns:
        # "$2.4M ARR", "$185k annual recurring revenue"
        - '\$\s*(?P<amount>[\d.,]+)\s*(?P<unit>k|m|mm|b|million|billion)?\s*(?:arr|annual\s+recurring\s+revenue)\b'
        # "ARR of $2.4M", "ARR: 2.4M", "annual recurring revenue 2.4M"
        - '(?:arr|annual\s+recurring\s+revenue)[:\s]+\$?\s*(?P<amount>[\d.,]+)\s*(?P<unit>k|m|mm|b|million|billion)?\b'
      normalise:
        kind: number_with_unit
        unit_group: unit
        amount_group: amount
        units:
          k: 1_000
          m: 1_000_000
          mm: 1_000_000
          million: 1_000_000
          b: 1_000_000_000
          billion: 1_000_000_000

    # LLM fallback is the main path for TABLE-shaped financials. The prompt
    # must force the model to pick the latest NON-projected column and to
    # quote that exact cell verbatim — guardrail G2 rejects anything else.
    - method: llm
      confidence: 0.70
      retrieval_query: "ARR annual recurring revenue run rate subscription revenue"
      max_chunks: 4

# =====================================================================
# revenue  --  Annual Revenue (USD, latest actual)
# =====================================================================
# Separate from ARR because non-SaaS companies report revenue but not ARR.
# Also used by scorers that want GAAP revenue rather than booking-based ARR.
revenue:
  value_type: number
  unit: usd
  validate:
    min: 0
    max: 1_000_000_000_000
  # Temporal contract: same shape as ARR -- annual, scenario-classified.
  temporal:
    requires: [as_of_date, scenario]
    period_granularity: year
    default_scenario_filter: actual
  methods:
    - method: regex
      confidence: 0.85
      patterns:
        # "$1.8M revenue", "$300k in revenue"
        - '\$\s*(?P<amount>[\d.,]+)\s*(?P<unit>k|m|mm|b|million|billion)?\s*(?:in\s+)?revenue\b'
        # "revenue of $1.8M", "revenue: 1.8M", "revenue 2025: $1.8M"
        # The optional year label is skipped so "2025" is never read as the amount.
        - '\brevenue(?:\s+(?:fy)?(?:19|20)\d{2})?[:\s]+\$?\s*(?P<amount>[\d.,]+)\s*(?P<unit>k|m|mm|b|million|billion)?\b'
      normalise:
        kind: number_with_unit
        unit_group: unit
        amount_group: amount
        units:
          k: 1_000
          m: 1_000_000
          mm: 1_000_000
          million: 1_000_000
          b: 1_000_000_000
          billion: 1_000_000_000

    - method: llm
      confidence: 0.65
      retrieval_query: "revenue sales top line total revenue"
      max_chunks: 4

# =====================================================================
# gross_margin  --  Gross Margin percentage (0-100)
# =====================================================================
# Stored as a plain number (e.g. "71" for 71%), NOT a ratio. validate.max
# of 100 also catches typos like "710%".
gross_margin:
  value_type: number
  unit: percent
  validate:
    min: -100            # negative GM happens early-stage
    max: 100
  # Temporal contract: % tied to a specific year (or TTM). Same rules as ARR.
  temporal:
    requires: [as_of_date, scenario]
    period_granularity: year
    default_scenario_filter: actual
  methods:
    - method: regex
      confidence: 0.88
      patterns:
        # "gross margin 71%", "gross margin: 71%", "GM 71%"
        - '\b(?:gross\s+margin|gm)[:\s]+(?P<amount>-?\d{1,3}(?:\.\d+)?)\s*%'
        # "71% gross margin", "71% GM"
        - '(?P<amount>-?\d{1,3}(?:\.\d+)?)\s*%\s+(?:gross\s+margin|gm)\b'
      normalise:
        kind: number_with_unit
        amount_group: amount
        units: {}         # no unit multiplier -- we capture a percent directly

    - method: llm
      confidence: 0.65
      retrieval_query: "gross margin gross profit margin GM"
      max_chunks: 3

# =====================================================================
# burn_rate  --  Monthly cash burn (USD, absolute value)
# =====================================================================
# Stored as a POSITIVE number. Decks write burn with parentheses
# ("(1.8)") or a minus sign; we just capture the magnitude. Scoring
# logic can interpret "higher burn = worse" without caring about sign.
burn_rate:
  value_type: number
  unit: usd
  validate:
    min: 0
    max: 1_000_000_000
  # Temporal contract: burn is monthly by convention. Decks sometimes show
  # annual burn in a financials table -- extractor should set granularity
  # from context; if it can't, the observation is rejected.
  temporal:
    requires: [as_of_date, scenario]
    period_granularity: month
    default_scenario_filter: actual
  methods:
    - method: regex
      confidence: 0.85
      patterns:
        # "$1.8M burn", "$1.8M monthly burn", "$1.8M cash burn"
        - '\$\s*(?P<amount>[\d.,]+)\s*(?P<unit>k|m|mm|b|million|billion)?\s*(?:monthly\s+|cash\s+)?burn(?:\s+rate)?\b'
        # "burn rate: $1.8M", "monthly burn 1.8M"
        - '\b(?:monthly\s+)?burn(?:\s+rate)?[:\s]+\$?\s*(?P<amount>[\d.,]+)\s*(?P<unit>k|m|mm|b|million|billion)?\b'
      normalise:
        kind: number_with_unit
        unit_group: unit
        amount_group: amount
        units:
          k: 1_000
          m: 1_000_000
          mm: 1_000_000
          million: 1_000_000
          b: 1_000_000_000
          billion: 1_000_000_000

    - method: llm
      confidence: 0.65
      retrieval_query: "burn rate monthly burn cash burn net burn"
      max_chunks: 4

# =====================================================================
# customer_count  --  Number of paying customers
# =====================================================================
# Integer. Deliberately narrow keyword set — we do NOT match "users"
# (freemium inflation) or "signups" (even worse). "Paying customers"
# and "customers" only. Engine picks first regex hit per chunk.
customer_count:
  value_type: number
  unit: count
  validate:
    min: 0
    max: 10_000_000_000
  # Temporal contract: customer count is a point-in-time snapshot.
  # Target-customer projections (e.g. "410 by 2028") must not win over today.
  temporal:
    requires: [as_of_date, scenario]
    period_granularity: point_in_time
    default_scenario_filter: actual
  methods:
    - method: regex
      confidence: 0.85
      patterns:
        # "410 paying customers", "1,200 customers"
        - '(?P<amount>\d{1,3}(?:,\d{3})*|\d+)\s+(?:paying\s+)?customers\b'
        # "customers: 410", "paying customers = 410"
        - '\b(?:paying\s+)?customers[:=\s]+(?P<amount>\d{1,3}(?:,\d{3})*|\d+)\b'
      normalise:
        kind: integer
        amount_group: amount

    - method: llm
      confidence: 0.65
      retrieval_query: "customers paying customers logos accounts"
      max_chunks: 3

# =====================================================================
# runway_months  --  Runway (months of cash remaining)
# =====================================================================
# Integer months. "18 months of runway" -> 18. NOT ticker years.
runway_months:
  value_type: number
  unit: months
  validate:
    min: 0
    max: 120             # 10-year runway = implausible; guards against typos
  # Temporal contract: runway is a snapshot from a specific balance-sheet date.
  # "18 months of runway as of Q4 2024" is meaningfully different from today.
  temporal:
    requires: [as_of_date]
    period_granularity: point_in_time
    default_scenario_filter: actual
  methods:
    - method: regex
      confidence: 0.90
      patterns:
        # "18 months of runway", "18 months runway"
        - '(?P<amount>\d{1,3})\s+months?\s+(?:of\s+)?runway\b'
        # "runway: 18 months", "runway of 18 months"
        - '\brunway[:\s]+(?:of\s+)?(?P<amount>\d{1,3})\s+months?\b'
      normalise:
        kind: integer
        amount_group: amount

    - method: llm
      confidence: 0.65
      retrieval_query: "runway months of cash remaining cash position"
      max_chunks: 3

# =====================================================================
# technical_cofounder  --  Is there a technical co-founder on the team?
# =====================================================================
# Boolean. Positive-only signal (same pattern as prior_successful_exit):
# absence of evidence is NOT evidence of absence, so we never emit
# `false` deterministically. require_context forces the enum_map to
# only fire on chunks that mention founders/co-founders, preventing
# "our CTO advisor" on a random slide from triggering.
technical_cofounder:
  value_type: boolean
  # Temporal contract: boolean trait of the founding team at present.
  # Point-in-time; no scenario.
  temporal:
    requires: []
    period_granularity: point_in_time
  methods:
    - method: enum_map
      confidence: 0.80
      require_context:
        any_of:
          - "founder"
          - "co-founder"
          - "cofounder"
          - "founding team"
      map:
        "technical co-founder":   true
        "technical cofounder":    true
        "cto & co-founder":       true
        "cto and co-founder":     true
        "cto, co-founder":        true
        "co-founder & cto":       true
        "co-founder and cto":     true
        "co-founder, cto":        true
        "engineer co-founder":    true

    - method: llm
      confidence: 0.65
      retrieval_query: "CTO technical co-founder engineer founding team"
      max_chunks: 4
